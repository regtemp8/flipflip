services:
  flipflip:
    # run latest release
    image: ghcr.io/regtemp8/flipflip:latest
    # run from source
    # image: flipflip
    # build:
    #   context: .
    # pull_policy: build # force build
    environment:
      FF_PORT: 5050
      FF_HOST: 0.0.0.0
      FF_SAVE_DIR: /opt/flipflip
      FF3_DATA_DIR: /tmp/flipflip
      FF_SCRIPT_DIR: /home/root/scripts
      FF_AUDIO_DIR: /home/root/audio
      FF_CONTENT_DIR: /home/root/content
      FF_VIDEO_DIR: /home/root/video
    volumes:
      - ./docker-data/flipflip:/opt/flipflip
      - ./docker-data/data/flipflip:/tmp/flipflip
      - ./docker-data/data/scripts:/home/root/scripts
      - ./docker-data/data/audio:/home/root/audio
      - ./docker-data/data/content:/home/root/content
      - ./docker-data/data/video:/home/root/video   
    ports:
      - 5050:5050

  hydrusclient:
    image: ghcr.io/hydrusnetwork/hydrus:latest
    container_name: hydrusclient
    restart: unless-stopped
    environment:
      - UID=1000
      - GID=1000
    volumes:
      - ./docker-data/hydrus:/var/lib/hydrus/db
    tmpfs:
      - /tmp
    ports:
      - 5800:5800   # noVNC
      - 5900:5900   # VNC
      - 45868:45868 # Booru
      - 45869:45869 # API
    profiles:
      - hydrus

  piwigo:
    image: lscr.io/linuxserver/piwigo:latest
    container_name: piwigo
    depends_on:
      - mysql
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./docker-data/piwigo/config:/var/lib/piwigo/config
      - ./docker-data/piwigo/gallery:/var/lib/piwigo/gallery
    ports:
      - 5080:80
    restart: unless-stopped
    profiles:
      - piwigo
    
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=toor
      - MYSQL_USER=piwigo
      - MYSQL_PASSWORD=piwigo
      - MYSQL_DATABASE=piwigo
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    ports:
      - 3306:3306
    restart: unless-stopped
    profiles:
      - piwigo