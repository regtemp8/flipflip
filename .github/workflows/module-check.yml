name: Module Check

on:
  workflow_call:
    inputs:
      display-name:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      format-task:
        required: false
        type: string
      build-task:
        required: false
        type: string
      build-task-extra:
        required: false
        type: string
      depends-on-common:
        required: false
        type: boolean
      do-lint-task:
        required: false
        type: boolean
    outputs:
      run_tests:
        value: ${{ jobs.check.outputs.changed_files }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed_files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Get all changed files
        id: changed_files
        uses: tj-actions/changed-files@v46.0.5
        with:
          files: ${{ inputs.working-directory }}/src/**
      - name: Enable Yarn
        if: ${{ steps.changed_files.outputs.any_changed == 'true' }}
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
      - name: Build Common Dependency
        if: ${{ steps.changed_files.outputs.any_changed == 'true' && inputs.depends-on-common == true }}
        uses: ./.github/actions/build-dependency
        with:
          working-directory: ./common
          build-task: build:main
          build-task-extra: build:module
      - name: Install ${{ inputs.display-name }}
        if: ${{ steps.changed_files.outputs.any_changed == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: yarn install
      - name: Lint ${{ inputs.display-name }}
        if: ${{ steps.changed_files.outputs.any_changed == 'true' && inputs.do-lint-task != false }}
        working-directory: ${{ inputs.working-directory }}
        run: yarn test:lint
      - name: Format ${{ inputs.display-name }}
        if: ${{ steps.changed_files.outputs.any_changed == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: yarn ${{ inputs.format-task || 'test:format' }}
      - name: Build ${{ inputs.display-name }} ${{ inputs.build-task  || ''}}
        if: ${{ steps.changed_files.outputs.any_changed == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: yarn ${{ inputs.build-task || 'build' }}
      - name: Build Extra ${{ inputs.display-name }} ${{ inputs.build-task-extra  || ''}}
        if: ${{ steps.changed_files.outputs.any_changed == 'true' && inputs.build-task-extra != null }}
        working-directory: ${{ inputs.working-directory }}
        run: yarn ${{ inputs.build-task-extra }}