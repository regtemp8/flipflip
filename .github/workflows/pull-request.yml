name: Pull Request

on:
  pull_request:
    branches: [v4.0.0]

jobs:
  common:
    uses: ./.github/workflows/module-check.yml
    with:
      display-name: Common
      working-directory: ./common
      format-task: test:prettier
      build-task: build:main
      build-task-extra: build:module
  client:
    uses: ./.github/workflows/module-check.yml
    with:
      display-name: Client
      working-directory: ./client
      depends-on-common: true
  server:
    uses: ./.github/workflows/module-check.yml
    with:
      display-name: Server
      working-directory: ./server
      build-task: tsc
      depends-on-common: true
  test:
    needs: [common, client, server]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install common dependencies
      run: npm ci
      working-directory: ./common
    - name: Build common main
      run: npm run build:main
      working-directory: ./common
    - name: Build common module
      run: npm run build:module
      working-directory: ./common
    - name: Install client dependencies
      run: npm ci
      working-directory: ./client
    - name: Install client dependencies
      run: npm ci
      working-directory: ./server
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: ./server
    - name: Run Playwright tests
      run: npx playwright test
      working-directory: ./server
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: ./server/playwright-report/
        retention-days: 30
