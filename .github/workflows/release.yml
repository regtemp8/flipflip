name: Release

on:
  release:
    types: [published, edited]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}      
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      
  build:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
          os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    env:
      PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'win' || 'macos') }}
      PLATFORM_NAME: ${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'windows' || 'macos') }}
      EXTENSION: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
    - name: Install setuptools
      if: ${{matrix.os == 'macos-latest'}}
      run: brew install python-setuptools
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Enable Yarn
      run: |
        corepack enable
        corepack prepare yarn@stable --activate
    - name: Install Common
      working-directory: ./common
      run: yarn install --immutable
    - name: Build Common Main
      working-directory: ./common
      run: yarn build:main
    - name: Build Common Module
      working-directory: ./common
      run: yarn build:module      
    - name: Install Client
      working-directory: ./client
      run: yarn install --immutable
    - name: Build Client
      working-directory: ./client
      run: yarn build
    - name: Get Package Version
      id: get-package-version
      uses: stevenbenitez/get-package-version-action@v1
      with:
        path: ./server
    - name: Install Server
      working-directory: ./server
      run: yarn install --immutable
    - name: Install FFProbe
      if: false # use when supporting arm64
      uses: actions/github-script@v7
      env:
        OS: ${{ matrix.os }}
      with:
        script: |
          const fs = require('fs')
          const path = require('path')
          const { Readable } = require('stream');
          const { finished } = require('stream/promises');

          const downloadFile = async (url, destination) => {
            const res = await fetch(url);
            const fileStream = fs.createWriteStream(destination, { flags: 'wx' });
            await finished(Readable.fromWeb(res.body).pipe(fileStream));
          };

          const targets = {}
          targets['ubuntu-latest'] = 'linux'
          targets['windows-latest'] = 'win32'
          targets['macos-latest'] = 'darwin'
          const target = `${targets[process.env.OS]}-${process.env.ARCH}`

          const ffprobePath = path.resolve('./server', 'node_modules', '@ffprobe-installer', target)
          if(!fs.existsSync(ffprobePath)) {
            await fs.promises.mkdir(ffprobePath)
            const executable = process.env.OS == 'windows-latest' ? 'ffprobe.exe' : 'ffprobe'
            const files = ['package.json', executable]
            for (const file of files) {
              const url = `https://github.com/SavageCore/node-ffprobe-installer/raw/refs/tags/v2.1.2/platforms/${target}/${file}`
              await downloadFile(url, path.join(ffprobePath, file))
            }
          }

    - name: Build server
      working-directory: ./server
      run: yarn prod
    - name: Move client output to server
      run: mv ./client/dist ./server/bin/public/
    - name: Create package
      working-directory: ./server
      run: yarn pkg -t node22-${{ env.PLATFORM }}-x64 --compress Brotli .
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./server/dist/server${{ env.EXTENSION }}
        asset_name: FlipFlip-${{ env.PLATFORM_NAME }}-x64-${{ steps.get-package-version.outputs.version }}${{ env.EXTENSION }}
        asset_content_type: application/octet-stream