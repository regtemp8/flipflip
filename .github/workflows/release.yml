name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]
            arch: [x64, arm64]
    env:
      PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'windows-latest' && 'win32' || 'darwin') }}
      PLATFORM_NAME: ${{ matrix.os == 'ubuntu-latest' && 'Linux' || (matrix.os == 'windows-latest' && 'Windows' || 'Mac') }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
    - name: Enable Yarn
      run: |
        npm install -g corepack
        corepack enable
        corepack prepare yarn@stable --activate
    - name: Install packages
      run: yarn install
    - name: Make Release
      run: yarn make --platform ${{ env.PLATFORM }} --arch ${{ matrix.arch }}
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: softprops/action-gh-release@v3
      with:
        working_directory: out/make/zip/${{ env.PLATFORM }}/${{ matrix.arch }}
        files: |
          FlipFlip-${{ env.PLATFORM_NAME }}-${{ matrix.arch }}-*.zip